# Refreshes the FOCA (BAZL) drone restriction zones once a day.
# The data script produces identical files when nothing changed, so a commit is only made
# when FOCA actually published new data. In that case the site is redeployed on Vercel.
name: Update zone data

on:
  schedule:
    - cron: '30 4 * * *' # daily at 04:30 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: update-zones
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download and prepare zones
        run: npm run data:zones
      # A broken data update must not reach the site (see src/data/data.test.ts).
      - name: Unit tests with the new data
        run: npm test
      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- public/data; then
            echo "Zone data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: update BAZL zones ($(node -p "require('./public/data/zones-meta.json').dataAsOf.slice(0, 10)"))"
          # Someone may have pushed to main while this job ran; put the data commit on top.
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # On the Vercel Hobby plan, only commits by the account owner deploy on their own, so a commit
      # by github-actions[bot] needs the deploy hook. It builds the latest commit on main (D21).
      - name: Deploy on Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret VERCEL_DEPLOY_HOOK_URL is missing. The new data goes live with the next deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
