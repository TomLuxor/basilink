# Re-computes the driving routes between all sites with OpenRouteService.
# Needs the repository secret ORS_API_KEY. Runs monthly (road networks change slowly) and on demand.
name: Update driving routes

on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the first day of every month
  workflow_dispatch:

concurrency:
  group: update-routes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compute routes
        run: npm run data:routes
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      - name: Commit if the routes changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- public/data/routes)" ]; then
            echo "Routes unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/routes
          git commit -m "data: update driving routes"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN do not trigger the deploy workflow, so call it directly.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
